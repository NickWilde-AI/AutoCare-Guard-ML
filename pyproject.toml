[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autocare-guard-ml"
version = "0.1.0"
description = "AutoCare：新能源汽车售后风险智能研判与工单路由的多证据 LLM Judge 工程框架。"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Chen Peng" }]
dependencies = []

[project.optional-dependencies]
train = [
  "datasets>=2.18",
  "torch>=2.2",
  "transformers>=4.42",
  "trl>=0.9",
  "peft>=0.11",
]
serve = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.27",
  "pyyaml>=6.0",
]
dev = [
  "pytest>=8",
  "pyyaml>=6.0",
]

[project.scripts]
autocare-guard = "autocare_guard_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
